name: Controlled counterfeit status probe

on:
  pull_request:

permissions:
  statuses: write

jobs:
  counterfeit-status:
    name: security-review
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Publish a deliberately counterfeit status only on this disposable branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'menyona/menyona-platform'
          assert os.environ['GITHUB_HEAD_REF'] == 'ci-probe/security-enforcement'
          assert os.environ['GITHUB_ACTOR'] == 'dukkanai'
          sha = os.environ['PROBE_HEAD']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          request = urllib.request.Request(
              'https://api.github.com/repos/menyona/menyona-platform/statuses/' + sha,
              data=json.dumps({'state': 'success', 'context': 'security-review', 'description': 'Controlled counterfeit probe; not a real security approval'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Content-Type': 'application/json', 'User-Agent': 'Menyona-controlled-probe'},
          )
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Redirect blocked')
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
              assert response.status == 201
          print('Counterfeit status posted to the disposable probe head only.')
          PY
